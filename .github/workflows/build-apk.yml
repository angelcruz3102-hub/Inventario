name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- Gradle oficial, versión compatible con AGP 8.2.0 ---
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # --- Diagnóstico del SDK disponible en el runner ---
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || true
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/" 2>/dev/null || true

      # --- Licencias + componentes mínimos ---
      - name: Accept licenses and install SDK components
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          echo "Using SDKMANAGER: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      # --- Compilar usando Gradle directamente (sin wrapper huérfano) ---
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INDRHI-Inventario-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
