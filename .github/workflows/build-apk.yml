name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- Setup del SDK (sintaxis correcta para v3) ---
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '9.0'
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      # --- Instalar los paquetes concretos que necesita Gradle ---
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses <<< "y" > /dev/null 2>&1 || true

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.4

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INDRHI-Inventario-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
